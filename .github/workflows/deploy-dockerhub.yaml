name: Deploy to docker.io

on:
  workflow_dispatch:
    inputs:
      ecr-tag:
        description: 'AWS ECR tag'
        required: true
        default: 'latest'
        type: string
      target-tag:
        description: 'Docker.io tag'
        required: true
        default: 'X.Y.Z'
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || github.event.repository.name }}
  TARGET_REGISTRY: ${{ vars.TARGET_REGISTRY || 'docker.io' }}
  TARGET_REPOSITORY: ${{ vars.TARGET_REPOSITORY || 'reportportal/landing-aggregator' }}

jobs:
  manual-deploy:
    name: Retag and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Mask AWS account ID
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::${ACCOUNT_ID}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to target registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.TARGET_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || secrets.REGESTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.REGESTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Retag and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_TAG: ${{ inputs.ecr-tag }}
          IMAGE_TAG: ${{ inputs.target-tag }}
        run: |
          docker buildx imagetools create \
            $ECR_REGISTRY/$ECR_REPOSITORY:$ECR_TAG \
            --tag $TARGET_REGISTRY/$TARGET_REPOSITORY:$IMAGE_TAG \
            --tag $TARGET_REGISTRY/$TARGET_REPOSITORY:latest

      - name: Summary
        env:
          IMAGE_TAG: ${{ inputs.target-tag }}
        run: |
          {
            echo "## Docker Release Summary"
            echo ""
            echo "- Image: $TARGET_REGISTRY/$TARGET_REPOSITORY:$IMAGE_TAG"
            echo "- ECR source: $ECR_REPOSITORY:${{ inputs.ecr-tag }}"
            echo "- Commit: [$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
          } >> $GITHUB_STEP_SUMMARY
