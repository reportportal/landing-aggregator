name: Retag RC Docker image

on:
  pull_request_review:
    types: [submitted]

jobs:
  release:
    if: github.event.review.state == 'approved'
    uses: reportportal/.github/.github/workflows/dockerhub-release.yaml@main
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    with:
      aws-region: ${{ vars.AWS_REGION }}
      ecr-repository: ${{ vars.ECR_REPOSITORY || github.event.repository.name }}
      target-registry: docker.io
      target-repository: >-
        ${{
          contains(vars.TARGET_REPOSITORY, '/') && vars.TARGET_REPOSITORY
          || format('{0}/{1}',
               (!vars.TARGET_REGISTRY || contains(vars.TARGET_REGISTRY, '.')) && 'reportportal' || vars.TARGET_REGISTRY,
               vars.TARGET_REPOSITORY || github.event.repository.name)
        }}
      platforms: ${{ vars.BUILD_PLATFORMS || 'linux/amd64,linux/arm64' }}
      release-mode: rc
